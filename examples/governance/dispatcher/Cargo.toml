[package]
name = "ipsa-dispatcher"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "26.1.0"
stellar-access = "0.7.2"
stellar-macros = "0.7.2"
ipsa = { path = "../../..", default-features = false, features = ["gmp"] }

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
ipsa-test-light-client = { path = "../../../testing/light-client" }
