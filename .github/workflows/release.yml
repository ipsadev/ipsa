name: release

on:
  push:
    tags: ["v*", "ipsa-chains-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (v0.1.0 for ipsa, ipsa-chains-v0.1.0 for ipsa-chains); leave empty with dry_run to rehearse the branch this runs from"
        required: false
        default: ""
        type: string
      crate:
        description: "crate to rehearse when no tag is given"
        required: false
        default: ipsa
        type: choice
        options: [ipsa, ipsa-chains]
      dry_run:
        description: "run every gate but do not publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}

jobs:
  release:
    name: gate, publish, announce
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
          fetch-depth: 0

      - name: setup rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: the tag must match the crate version
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_CRATE: ${{ github.event.inputs.crate }}
        run: |
          case "$TAG" in
            ipsa-chains-v*) crate=ipsa-chains; prefix=ipsa-chains-v ;;
            v*) crate=ipsa; prefix=v ;;
            "") crate="${INPUT_CRATE:-ipsa}"; [ "$crate" = ipsa ] && prefix=v || prefix="$crate-v" ;;
            *) echo "::error::tag $TAG is neither vX.Y.Z nor ipsa-chains-vX.Y.Z"; exit 1 ;;
          esac
          version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
          echo "CRATE=$crate" >> "$GITHUB_ENV"
          if [ -z "$TAG" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::a release needs a tag; to rehearse without one, run with dry_run"
              exit 1
            fi
            echo "TAG=$prefix$version" >> "$GITHUB_ENV"
            echo "::notice::rehearsing $crate $prefix$version from $GITHUB_REF_NAME, no tag needed"
          elif [ "$TAG" != "$prefix$version" ]; then
            echo "::error::tag $TAG does not match $crate's Cargo.toml version $version"
            exit 1
          else
            echo "tag $TAG matches crate version $version"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: the version must not already be on crates.io, unless it came from this commit
        run: |
          body="$(curl -sS --max-time 30 \
            -H 'User-Agent: ipsadev-release (github actions)' \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")"

          if ! printf '%s' "$body" | grep -q '"version"'; then
            echo "$VERSION is not published yet"
            exit 0
          fi

          curl -sSfL --max-time 60 \
            -H 'User-Agent: ipsadev-release (github actions)' \
            -o /tmp/published.crate \
            "https://static.crates.io/crates/$CRATE/$CRATE-$VERSION.crate"

          published="$(tar -xzOf /tmp/published.crate "$CRATE-$VERSION/.cargo_vcs_info.json" \
            | sed -n 's/.*"sha1": *"\([0-9a-f]*\)".*/\1/p')"
          commit="$(git rev-parse HEAD)"

          if [ "$published" != "$commit" ]; then
            echo "::error::$CRATE $VERSION is already published from ${published:-an unknown commit}, not $commit; crates.io versions cannot be replaced"
            exit 1
          fi

          echo "PUBLISHED=true" >> "$GITHUB_ENV"
          echo "::notice::$CRATE $VERSION is already published from this commit; announcing it without publishing again"


      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: setup foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: setup just
        uses: extractions/setup-just@v3

      - name: cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-latest-1

      - name: install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: just ci
        run: just ci

      - name: package, and compile what crates.io would receive
        run: just package "$CRATE"

      - name: publish, for real this time
        if: ${{ github.event.inputs.dry_run != 'true' && env.PUBLISHED != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --package "$CRATE"

      - name: say what a dry run skipped
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "::notice::dry run - every gate passed, nothing was published"

      - name: announce the release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "$CRATE" = ipsa-chains ]; then
              printf 'The Stellar and Cosmos encoding for IBC v2 services, %s: Soroban values, IBC v2 messages, Tendermint client and consensus states and the router'"'"'s packet events.\n\n' "$TAG"
            else
              printf 'Building blocks for IBC v2 on Stellar, %s: `core`, `types`, `app`, `gmp` and `ics20`, each behind a feature of the same name and on by default, and `gateway`, the proof API and Stellar gateway gRPC clients and servers, off by default.\n\n' "$TAG"
            fi
            printf '```toml\n'
            printf '%s = "%s"\n' "$CRATE" "$VERSION"
            printf '```\n\n'
            printf -- '- [crates.io](https://crates.io/crates/%s/%s)\n' "$CRATE" "$VERSION"
            printf -- '- [docs.rs](https://docs.rs/%s/%s)\n\n' "$CRATE" "$VERSION"
            printf 'Published from %s after `just ci`: fmt, clippy, the test suite and `cargo audit`.\n' "$TAG"
          } > /tmp/notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
